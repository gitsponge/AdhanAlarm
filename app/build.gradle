plugins {
    id 'com.android.application'
}

android {
    namespace = 'islam.adhanalarm'
    compileSdk = 37

    defaultConfig {
        applicationId = 'islam.adhanalarm'
        minSdk = 23
        targetSdk = 37
        versionCode = 121 // Google Play needs every upload above the last one, which was 120 (4.0)
        versionName = '4.0.1'
    }

    signingConfigs {
        release {
            // The release key and its passwords come from the environment at build time, so none of them live in the repository
            if (System.getenv('ADHAN_ALARM_KEYSTORE')) {
                storeFile = file(System.getenv('ADHAN_ALARM_KEYSTORE'))
                storePassword = System.getenv('ADHAN_ALARM_STORE_PASSWORD')
                keyAlias = System.getenv('ADHAN_ALARM_KEY_ALIAS')
                keyPassword = System.getenv('ADHAN_ALARM_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true // Google Play asks for shrunk, optimised code; it also keeps the app small
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
        debug {
            // Installs beside the Play version as "Adhān Alarm Dev", so testing never touches the real one
            applicationIdSuffix = '.dev'
            versionNameSuffix = '-dev'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true // Android calls the tests don't care about return defaults instead of failing
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
